    <body>
        <section class="body-wrapper">
            <div class="row">
                <div class="col col-md col-xl">
</div>
                <div class="col-10 col-md-10 col-xl-5 overlay">
                    <div class="container" id="snow-castle">
                        <div class="logo">
                            <img src="assets/snow-castle.svg" alt="distell-ara-line"/>
                        </div>
                        <div class="headline">
                            <div class="row">
                                <div class="col-12 col-md-12">
                                    <h4 class="text-white">THANKS FOR SHARING YOUR THOUGHTS!</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="body-content container-fluid pb-2">
                        <div class="row">
                            <div class="col col-lg col-md col-sm">
</div>
                            <div class="col-10 col-lg-10 col-md-10 col-sm-10">
                                <h1 class="mt-3">ONE LAST STEP</h1>
                                <p class="mt-2">Complete your details below to enter into the draw for a chance to win a Harman Kardon speaker.</p>
                                <form role="form">
                                    <div class="mb-1">
                                        <label for="firstName">First name*</label>
                                        <input type="text" class="form-control" id="firstName" name="firstName" aria-describedby="firstName" placeholder="first name" required="true"/>
                                    </div>
                                    <div class="mb-1">
                                        <label for="lastName">Last name*</label>
                                        <input type="text" class="form-control" id="lastName" name="lastName" aria-describedby="lastName" placeholder="last name" required="true"/>
                                    </div>
                                    <div class="mb-1">
                                        <label for="cellNumber">Cell number*</label>
                                        <input type="tel" class="form-control" id="cellNumber" name="cellNumber" placeholder="e.g 0841234567" required="true"/>
                                    </div>
                                    <div class="mb-1">
                                        <label for="EmailAddress">Email address</label>
                                        <input type="email" class="form-control" id="EmailAddress" name="EmailAddress" placeholder="example@domain.com"/>
                                    </div>
                                    <div class="mb-1">
                                        <label for="provinceSelect">Province*</label>
                                        <select id="provinceSelect" name="provinceSelect" class="form-control" required="true">
                                            <option value="">select</option>
                                            <option value="Option1">Option1</option>
                                            <option value="Option2">Option2</option>
                                            <option value="Option3">Option3</option>
                                        </select>
                                    </div>
                                    <div class="form-check mb-1 pt-2">
                                        <input type="checkbox" class="form-check-input" id="optIn"/>
                                        <label class="form-check-label pb-0 ps-2 pt-2" for="optIn">I’d like to receive Castle Lite news and promotions</label>
                                    </div>
                                    <div class="form-check mb-1">
                                        <input type="checkbox" class="form-check-input" id="termsAndConditions"/>
                                        <label class="form-check-label pb-0 ps-2 pt-0" for="termsAndConditions">I accept the <a href="#"> Terms and Conditions*</a>
                                        </label>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                </form>
                                <div class="mb-1 mt-4 notice">One entry per person. T&Cs apply.</div>
                            </div>
                            <div class="col col-lg col-md col-sm">
</div>
                        </div>
                    </div>
                </div>
                <div class="col col-md col-xl">
</div>
            </div>
        </section>
        <section class="footer">
            <div class="container footer-area">
                <img src="assets/sab-ara-line.svg" alt="sab-ara-line" class="w-100"/>
            </div>
        </section>
